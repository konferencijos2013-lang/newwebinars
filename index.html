<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewWebinars — Webinars that convert</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.onerror = function (message, source, lineno, colno, error) {
        fetch('http://127.0.0.1:7510/ingest/98e51e74-2cb8-43d7-ae19-9d551565ede3', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': '85756a' },
          body: JSON.stringify({
            sessionId: '85756a',
            id: 'log_global_error',
            runId: 'initial',
            hypothesisId: 'D',
            location: 'window.onerror',
            message: 'Global error',
            data: { message, source, lineno, colno, error: String(error) },
            timestamp: Date.now(),
          }),
        }).catch(() => {})
      }
      window.onunhandledrejection = function (event) {
        fetch('http://127.0.0.1:7510/ingest/98e51e74-2cb8-43d7-ae19-9d551565ede3', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Debug-Session-Id': '85756a' },
          body: JSON.stringify({
            sessionId: '85756a',
            id: 'log_unhandled_rejection',
            runId: 'initial',
            hypothesisId: 'D',
            location: 'window.onunhandledrejection',
            message: 'Unhandled rejection',
            data: { reason: String(event.reason) },
            timestamp: Date.now(),
          }),
        }).catch(() => {})
      }
    </script>
  </body>
</html>
